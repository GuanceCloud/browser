name: Guance release build

on:
  push:
    tags:
      - "*-g*"
  pull_request:
    paths:
      - ".github/workflows/guance-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-ref:
    name: validate release ref
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Require tags to point to main history
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-linux:
    name: build linux ${{ matrix.arch }}
    needs: validate-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            cpu_flag: -Dcpu=x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            cpu_flag: -Dcpu=generic

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          os: linux
          arch: ${{ matrix.arch }}
          install-v8: ${{ matrix.arch == 'x86_64' && 'true' || 'false' }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: matrix.arch == 'aarch64'
        with:
          repository: lightpanda-io/zig-v8-fork
          ref: ec68fae9e869b0cb47b8eea972d1472bfa669933 # v0.5.4
          path: .zig-v8-fork

      - name: Build V8 on Ubuntu 22.04
        if: matrix.arch == 'aarch64'
        working-directory: .zig-v8-fork
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -yq libglib2.0-dev lld
          clang_dir=/usr/lib/llvm-22/lib/clang/22
          sudo ln -nsf "$clang_dir/lib/linux/libclang_rt.builtins-aarch64.a" "$clang_dir/lib/linux/libclang_rt.builtins.a"
          sudo ln -nsf "$clang_dir/lib/linux" "$clang_dir/lib/aarch64-unknown-linux-gnu"
          sudo ln -nsf "$clang_dir" /usr/lib/llvm-22/lib/clang/23
          sed -i 's|/usr/lib/llvm-23|/usr/lib/llvm-22|' build.zig
          zig build -Dtarget=aarch64-linux -Doptimize=ReleaseSafe build-v8
          v8_lib=$(find .lp-cache -path '*/out/linux/release_*/obj/zig/libc_v8.a' -print -quit)
          test -n "$v8_lib"
          mkdir -p ../v8
          ln -s "$(realpath "$v8_lib")" ../v8/libc_v8.a

      - name: Build V8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: Build Lightpanda
        env:
          VERSION_FLAG: ${{ github.ref_type == 'tag' && format('-Dversion={0}', github.ref_name) || '-Dversion=nightly' }}
        run: >-
          zig build
          -Dsnapshot_path=../../snapshot.bin
          -Dprebuilt_v8_path=v8/libc_v8.a
          -Doptimize=ReleaseFast
          ${{ matrix.cpu_flag }}
          ${{ env.VERSION_FLAG }}

      - name: Prepare binary
        run: |
          mv zig-out/bin/lightpanda lightpanda-${{ matrix.arch }}-linux
          chmod 0755 lightpanda-${{ matrix.arch }}-linux
          ./lightpanda-${{ matrix.arch }}-linux version

      - name: Verify Ubuntu 22.04 glibc compatibility
        run: |
          binary="lightpanda-${{ matrix.arch }}-linux"
          max_glibc=$(readelf --version-info "$binary" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
            | sort -Vu \
            | tail -1)
          test -n "$max_glibc"
          echo "Highest required glibc symbol: $max_glibc"
          test "$(printf '%s\n%s\n' "$max_glibc" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightpanda-${{ matrix.arch }}-linux
          path: lightpanda-${{ matrix.arch }}-linux
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub release
    if: github.ref_type == 'tag'
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lightpanda-*-linux
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum lightpanda-*-linux > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: false
          artifacts: "dist/*"
          artifactErrorsFailBuild: true
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          makeLatest: false
          prerelease: true
          tag: ${{ github.ref_name }}
